<!doctype html>
<html lang="id" data-theme="arctic" data-window-focused="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruthenium Shell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    (() => {
      try {
        const raw = localStorage.getItem("ruthenium_chrome_prefs_v3");
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && (parsed.theme === "arctic" || parsed.theme === "midnight" || parsed.theme === "aurora")) {
            document.documentElement.dataset.theme = parsed.theme;
          }
        }
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="/shell.css?v=6">
</head>
<body>
  <div class="shell-root" id="shell-root">
    <!-- Row 1: Floating Pill Tab Strip (44px) -->
    <div class="tabstrip" id="tabstrip" data-drag-region="true">
      <div class="tab-list no-scrollbar" id="tab-list" role="tablist" aria-orientation="horizontal" aria-label="Tab terbuka"></div>

      <button
        type="button"
        class="tabstrip-new-btn"
        id="btn-new-tab"
        aria-label="Tab baru (Ctrl+T)"
        title="Tab baru (Ctrl+T)"
      >
        <svg class="icon-14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M8 3.2v9.6M3.2 8h9.6"></path>
        </svg>
      </button>

      <div class="drag-strip" data-drag-region="true" aria-hidden="true"></div>

      <div class="caption-controls" role="group" aria-label="Kontrol jendela">
        <button type="button" class="caption-btn" id="btn-minimize" aria-label="Perkecil" title="Perkecil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M5 12h14"></path>
          </svg>
        </button>

        <button type="button" class="caption-btn" id="btn-maximize" aria-label="Perbesar" title="Perbesar">
          <svg id="icon-maximize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="4" width="16" height="16" rx="2"></rect>
          </svg>
          <svg id="icon-restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" hidden>
            <path d="M8 4h10a2 2 0 0 1 2 2v10"></path>
            <rect x="4" y="8" width="12" height="12" rx="2"></rect>
          </svg>
        </button>

        <button type="button" class="caption-btn caption-btn--close" id="btn-close" aria-label="Tutup" title="Tutup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Row 2: Rounded Navigation & Pill Omnibox Toolbar (48px) -->
    <header class="toolbar" id="toolbar">
      <div class="toolbar-nav" role="toolbar" aria-label="Kontrol navigasi">
        <button
          type="button"
          class="nav-btn"
          id="btn-back"
          aria-label="Kembali"
          title="Kembali (Alt+Left)"
          disabled
        >
          <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7"></path>
          </svg>
        </button>

        <button
          type="button"
          class="nav-btn"
          id="btn-forward"
          aria-label="Maju"
          title="Maju (Alt+Right)"
          disabled
        >
          <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7"></path>
          </svg>
        </button>

        <button
          type="button"
          class="nav-btn"
          id="btn-reload"
          aria-label="Muat ulang halaman"
          title="Muat ulang (Ctrl+R)"
        >
          <svg id="icon-reload" class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
            <path d="M21 3v5h-5"></path>
          </svg>
          <svg id="icon-stop" class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" hidden>
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <form class="omnibox" id="address-form" role="search" autocomplete="off">
        <span class="security-badge" id="security-badge" aria-hidden="true">
          <svg id="icon-search" class="icon-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <svg id="icon-lock" class="icon-14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" hidden>
            <rect x="3.2" y="7.2" width="9.6" height="6.3" rx="1.5"></rect>
            <path d="M5.2 7.2V5.3a2.8 2.8 0 0 1 5.6 0v1.9"></path>
          </svg>
          <svg id="icon-warn" class="icon-14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" hidden>
            <path d="M8 2.4 14 13H2L8 2.4Z"></path>
            <line x1="8" y1="6.3" x2="8" y2="9.3"></line>
            <circle cx="8" cy="11.3" r="0.6" fill="currentColor"></circle>
          </svg>
          <span class="security-chip" id="security-chip" hidden>Tidak aman</span>
        </span>

        <div class="origin-readout" id="origin-readout">
          <span class="origin-domain is-placeholder" id="origin-domain">Cari di Google atau masukkan URL</span>
          <span class="origin-path" id="origin-path"></span>
        </div>

        <label class="sr-only" for="address-input">Alamat URL atau kata kunci</label>
        <input
          type="text"
          class="address-input"
          id="address-input"
          list="omnibox-suggestions"
          placeholder="Cari di Google atau masukkan URL"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
        >
        <datalist id="omnibox-suggestions"></datalist>

        <button
          type="button"
          class="omnibox-action-btn"
          id="btn-share"
          aria-label="Salin tautan halaman"
          title="Salin URL"
          hidden
        >
          <svg id="icon-share" class="icon-14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5.2" y="5.2" width="7.6" height="8.3" rx="1.3"></rect>
            <path d="M10.5 5.2V3.8A1.3 1.3 0 0 0 9.2 2.5H4.5A1.3 1.3 0 0 0 3.2 3.8v6.5a1.3 1.3 0 0 0 1.3 1.3h.7"></path>
          </svg>
          <svg id="icon-share-check" class="icon-14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <path d="M3.5 8.5 6.5 11.5 12.5 4.8"></path>
          </svg>
        </button>
      </form>

      <div class="toolbar-actions">
        <button
          type="button"
          class="nav-btn"
          id="btn-sidebar"
          aria-expanded="false"
          aria-controls="sidebar"
          aria-label="Tampilkan atau sembunyikan panel samping"
          title="Panel Samping (Ctrl+B)"
        >
          <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3"></rect>
            <path d="M9 3v18"></path>
          </svg>
        </button>

        <button
          type="button"
          class="nav-btn"
          id="btn-settings"
          aria-expanded="false"
          aria-controls="sidebar"
          aria-label="Pengaturan browser"
          title="Pengaturan"
        >
          <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path>
          </svg>
        </button>
      </div>

      <div class="loading-seam" id="loading-seam"></div>
    </header>

    <!-- Collapsible Left Side Panel -->
    <aside class="sidebar" id="sidebar" aria-label="Panel samping" hidden>
      <div class="sidebar-header">
        <div class="sidebar-switcher" role="group" aria-label="Kategori panel">
          <button type="button" class="switcher-btn" data-panel-tab="workspace" aria-pressed="true">Panel</button>
          <button type="button" class="switcher-btn" data-panel-tab="settings" aria-pressed="false">Setelan</button>
        </div>
        <button type="button" class="panel-close-btn" id="sidebar-close-btn" aria-label="Tutup panel samping" title="Tutup">
          <svg class="icon-12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8"></path>
          </svg>
        </button>
      </div>

      <div class="sidebar-scroll">
        <div id="sidebar-default-view">
          <div class="sidebar-section">
            <div class="sidebar-section-head">
              <h2 class="sidebar-heading">Tab Terbuka</h2>
              <button type="button" class="sidebar-inline-btn" id="sidebar-new-tab-btn" title="Tab baru (Ctrl+T)">+ Baru</button>
            </div>
            <div class="sidebar-tab-list" id="sidebar-tab-list"></div>
          </div>

          <div class="sidebar-section">
            <label class="sidebar-heading" for="shell-quick-notes">Catatan Cepat</label>
            <textarea
              id="shell-quick-notes"
              class="sidebar-notes-area"
              rows="5"
              placeholder="Tulis catatan singkat saat browsing di sini..."
            ></textarea>
          </div>
        </div>

        <section class="sidebar-section settings-panel" id="panel-settings" aria-label="Pengaturan Browser" hidden>
          <div class="panel-list-card">
            <div class="panel-setting-block">
              <span class="panel-control-title">Tema tampilan</span>
              <div class="segmented-control" role="group" aria-label="Tema tampilan">
                <button type="button" class="segment-btn" data-shell-theme="arctic" aria-pressed="true">Arctic</button>
                <button type="button" class="segment-btn" data-shell-theme="midnight" aria-pressed="false">Midnight</button>
                <button type="button" class="segment-btn" data-shell-theme="aurora" aria-pressed="false">Aurora</button>
              </div>
            </div>

            <div class="panel-setting-block">
              <label class="panel-control-title" for="engine-select">Mesin pencari default</label>
              <select class="panel-select" id="engine-select">
                <option value="google">Google</option>
                <option value="duckduckgo">DuckDuckGo</option>
                <option value="bing">Bing</option>
              </select>
            </div>
          </div>

          <p class="panel-status" id="settings-status" role="status" aria-live="polite"></p>
        </section>
      </div>

      <div class="sidebar-footer">
        <svg class="sidebar-brand-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M32 4 L8 18 L8 46 L32 60 Z" fill="#0E1726"/>
          <path d="M32 4 L56 18 L56 46 L32 60 Z" fill="#172744"/>
          <path d="M32 4 L56 18 L32 32 Z" fill="#1F365E"/>
          <path d="M32 4 L56 18 L56 46 L32 60 L8 46 L8 18 Z" stroke="#35548A" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M19 18.8 L25.5 15 L25.5 49 L19 45.2 Z" fill="#F4F7FB"/>
          <path d="M25.5 15 L44.5 26 L44.5 28.8 L36.8 28.8 L25.5 22.3 Z" fill="#DCEBFC"/>
          <path d="M44.5 28.8 L44.5 31.6 L25.5 42.6 L25.5 35.3 L36.8 28.8 Z" fill="#60A5FA"/>
          <path d="M27.5 41.4 L34.8 37.2 L45 43.1 L45 45.2 L38.8 48.8 Z" fill="#93C5FD"/>
        </svg>
        <span>Ruthenium · WebView2</span>
      </div>

      <div class="sidebar-resizer" id="sidebar-resizer" aria-hidden="true"></div>
    </aside>

    <main class="viewport-frame" id="viewport-frame" aria-hidden="true"></main>
  </div>
  <script src="/shell.js?v=6"></script>
</body>
</html>
