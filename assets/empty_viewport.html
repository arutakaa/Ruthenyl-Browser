<!doctype html>
<html lang="id" data-theme="arctic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Baru</title>
  <link rel="icon" type="image/svg+xml" href="/ruthenium-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("ruthenium_ntp_theme_v2");
        if (saved === "arctic" || saved === "midnight" || saved === "aurora") {
          document.documentElement.dataset.theme = saved;
        }
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="/newtab.css?v=6">
  <script defer src="/newtab.js?v=6"></script>
</head>
<body>
  <main class="ntp-viewport">
    <div class="ntp-top-row">
      <div class="ntp-clock-pill glass-surface" aria-label="Waktu dan tanggal saat ini">
        <div id="live-clock" class="clock-time">00:00</div>
        <div id="live-date" class="clock-date">Memuat tanggal</div>
      </div>
    </div>

    <div class="ntp-center">
      <header class="ntp-brand">
        <div class="ntp-logo-wrap" aria-hidden="true">
          <div class="ntp-logo-glow"></div>
          <svg class="ntp-logo logo-float" width="72" height="72" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="hexTop" x1="20" y1="10" x2="100" y2="60" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#254e96"/>
                <stop offset="100%" stop-color="#132b57"/>
              </linearGradient>
              <linearGradient id="hexLeft" x1="15" y1="35" x2="60" y2="110" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#142d59"/>
                <stop offset="100%" stop-color="#09152c"/>
              </linearGradient>
              <linearGradient id="hexRight" x1="60" y1="35" x2="105" y2="110" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#0c1c3b"/>
                <stop offset="100%" stop-color="#050b18"/>
              </linearGradient>
              <linearGradient id="letterR" x1="40" y1="32" x2="82" y2="88" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#e0f2fe"/>
                <stop offset="50%" stop-color="#7dd3fc"/>
                <stop offset="100%" stop-color="#38bdf8"/>
              </linearGradient>
            </defs>
            <polygon points="60,8 106,34 106,86 60,112 14,86 14,34" fill="url(#hexLeft)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>
            <polygon points="60,8 106,34 60,60 14,34" fill="url(#hexTop)"/>
            <polygon points="60,60 106,34 106,86 60,112" fill="url(#hexRight)"/>
            <path d="M43 36H65.5C73.5 36 79 40.6 79 47.6C79 53.3 75.2 57.4 69.4 58.8L80.2 82H68.8L59.4 60.2H52.8V82H43V36ZM52.8 44.2V52.6H64.4C68.1 52.6 70.2 50.8 70.2 48.4C70.2 45.9 68.1 44.2 64.4 44.2H52.8Z" fill="url(#letterR)"/>
          </svg>
        </div>
        <div class="ntp-brand-text">
          <h1 class="ntp-wordmark">Ruthenium</h1>
          <p class="ntp-subtitle">Next-Gen Web Experience</p>
        </div>
      </header>

      <section class="ntp-search-section" aria-label="Pencarian web">
        <div class="ntp-search-box" id="search-box">
          <form id="main-search-form" class="ntp-search-form glass-surface search-elevated" role="search" autocomplete="off" novalidate>
            <button
              type="button"
              id="btn-engine-cycle"
              class="engine-pill"
              title="Klik untuk ganti mesin pencari"
              aria-label="Ganti mesin pencari: Google"
            >
              <span id="engine-icon" aria-hidden="true">G</span>
              <span id="engine-name">Google</span>
              <svg class="engine-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m6 9 6 6 6-6"></path>
              </svg>
            </button>

            <label class="sr-only" for="main-search-input">Cari di Google atau masukkan URL</label>
            <input
              id="main-search-input"
              class="ntp-search-input"
              type="text"
              placeholder="Cari di Google atau masukkan URL..."
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="search-suggestions"
              spellcheck="false"
              autocapitalize="off"
              autocomplete="off"
            >

            <button
              type="button"
              id="btn-search-clear"
              class="search-clear-btn"
              aria-label="Hapus teks pencarian"
              title="Hapus"
              hidden
            >
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <line x1="4" y1="4" x2="12" y2="12"></line>
                <line x1="12" y1="4" x2="4" y2="12"></line>
              </svg>
            </button>
            <span id="search-clear-sep" class="search-divider" aria-hidden="true" hidden></span>

            <button type="submit" class="search-submit-btn" aria-label="Cari" title="Cari">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
            </button>
          </form>

          <div id="search-dropdown" class="search-dropdown" hidden>
            <div class="search-dropdown-divider" aria-hidden="true"></div>
            <ul
              id="search-suggestions"
              class="suggestions-list"
              role="listbox"
              aria-label="Saran pencarian"
            ></ul>
            <div id="history-footer" class="history-footer" hidden>
              <button type="button" id="btn-clear-history" class="history-clear-all-btn">Hapus semua riwayat</button>
            </div>
          </div>
        </div>
        <p id="search-error" class="ntp-error" role="alert" hidden></p>
      </section>

      <section class="ntp-shortcuts" aria-label="Pintasan">
        <div id="shortcuts-grid" class="shortcuts-grid"></div>
      </section>
    </div>
  </main>

  <div id="shortcut-backdrop" class="ntp-backdrop" hidden>
    <div class="ntp-dialog glass-surface" role="dialog" aria-modal="true" aria-labelledby="shortcut-dialog-title">
      <h2 id="shortcut-dialog-title" class="ntp-dialog-title">Tambah Pintasan</h2>
      <p class="ntp-dialog-desc">Tambahkan situs favorit ke halaman Beranda Ruthenium.</p>
      <form id="shortcut-form" class="ntp-dialog-form" autocomplete="off" novalidate>
        <div class="ntp-field-group">
          <label class="ntp-label" for="shortcut-name">Nama Situs</label>
          <input id="shortcut-name" class="ntp-field" type="text" maxlength="32" placeholder="Contoh: Wikipedia">
        </div>
        <div class="ntp-field-group">
          <label class="ntp-label" for="shortcut-url">URL</label>
          <input id="shortcut-url" class="ntp-field" type="text" placeholder="https://id.wikipedia.org">
        </div>
        <p id="shortcut-error" class="ntp-error" role="alert" hidden></p>
        <div class="ntp-dialog-actions">
          <button type="button" id="btn-cancel-shortcut" class="ntp-btn ntp-btn--secondary">Batal</button>
          <button type="submit" class="ntp-btn ntp-btn--primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-box" class="ntp-toast glass-surface" role="status" aria-live="polite" hidden></div>
</body>
</html>
